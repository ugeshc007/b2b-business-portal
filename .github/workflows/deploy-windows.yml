name: Deploy Windows Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_production_check:
        description: Run strict production readiness checks during deploy
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: windows-production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: powershell
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "npm ci failed, falling back to npm install for optional platform dependency lockfile mismatch."
            npm install
          }

      - name: Prepare test database
        shell: powershell
        run: |
          $env:DATABASE_URL = "file:$env:RUNNER_TEMP\b2b-business-test.db"
          npm run db:init -- --reset

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run tests
        shell: powershell
        run: |
          $env:DATABASE_URL = "file:$env:RUNNER_TEMP\b2b-business-test.db"
          npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Windows server
    needs: test
    runs-on:
      - self-hosted
      - windows
      - b2b-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy application
        shell: powershell
        env:
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          DEPLOY_SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME }}
          DEPLOY_PM2_PROCESS_NAME: ${{ vars.DEPLOY_PM2_PROCESS_NAME }}
          RUN_PRODUCTION_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.run_production_check || vars.RUN_PRODUCTION_CHECK }}
        run: |
          $appDir = if ([string]::IsNullOrWhiteSpace($env:DEPLOY_APP_DIR)) { "C:\NEW\b2b-business-code" } else { $env:DEPLOY_APP_DIR }
          if (![System.IO.Path]::IsPathRooted($appDir)) {
            Write-Warning "DEPLOY_APP_DIR is not a full path: $appDir. Using C:\NEW\b2b-business-code."
            $appDir = "C:\NEW\b2b-business-code"
          }
          $serviceName = if ([string]::IsNullOrWhiteSpace($env:DEPLOY_SERVICE_NAME)) { "B2BBusinessPortal" } else { $env:DEPLOY_SERVICE_NAME }
          powershell -ExecutionPolicy Bypass -File .\scripts\deploy-windows.ps1 -AppDir $appDir -ServiceName $serviceName
